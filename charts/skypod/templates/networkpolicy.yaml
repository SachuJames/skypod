{{- if .Values.networkPolicy.enabled }}
# Default deny: every pod in the release namespace drops all ingress
# and egress unless another policy allows the traffic.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "skypod.fullname" . }}-default-deny
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skypod.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# The app policy: ingress to the app port from pods in this namespace
# and from the monitoring namespace (Prometheus scraping /metrics).
# Egress is DNS lookups only, towards CoreDNS in kube-system.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "skypod.fullname" . }}-app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skypod.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "skypod.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
      from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace | quote }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
