{{- if .Values.networkPolicy.enabled }}
# Nothing talks in or out of this namespace unless a policy allows it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "skypod.fullname" . }}-default-deny
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skypod.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Just the app: in from this namespace and the monitoring one, out to DNS only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "skypod.fullname" . }}-app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skypod.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "skypod.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
      from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace | quote }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
