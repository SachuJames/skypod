# Installs the chart from the Helm repo and keeps it synced: prune,
# self-heal, and a few retries when a sync fails.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: skypod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://sachujames.github.io/skypod/
    chart: skypod
    targetRevision: 0.2.0
    helm:
      values: |
        autoscaling:
          enabled: true
        serviceMonitor:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: skypod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
