# Needs kube-prometheus-stack in the cluster (make monitoring installs it).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: skypod
  labels:
    app.kubernetes.io/name: skypod
    # prometheus-operator only loads rules carrying its release labels.
    release: monitoring
spec:
  groups:
    - name: skypod.rules
      rules:
        - alert: SkypodHighErrorRate
          expr: |
            sum(rate(skypod_http_requests_total{status=~"5.."}[5m]))
              / sum(rate(skypod_http_requests_total[5m])) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: skypod error rate above 5 percent
            description: More than 5 percent of skypod requests returned a 5xx status over the last 5 minutes.
        - alert: SkypodTooManyRestarts
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace="skypod"}[10m]) > 3
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: skypod pods restarting repeatedly
            description: A skypod container restarted more than 3 times in 10 minutes.
    # SLO alerts for 99.9 percent availability: error budget is 0.001,
    # and burn rate is the error ratio divided by that budget (1 means
    # the budget lasts exactly the month).
    - name: skypod.slo
      rules:
        - alert: SkypodErrorBudgetFastBurn
          expr: skypod:error_ratio:1h / 0.001 > 14.4
          for: 5m
          labels:
            severity: page
          annotations:
            summary: skypod burning its error budget fast
            description: At the last hour's error rate the monthly error budget would be gone in about two days. Page whoever owns the service.
        - alert: SkypodErrorBudgetSlowBurn
          expr: skypod:error_ratio:6h / 0.001 > 6
          for: 15m
          labels:
            severity: ticket
          annotations:
            summary: skypod error budget draining steadily
            description: The 6 hour error rate is more than six times the budget rate. Not a page, but it needs a ticket before the budget does.
